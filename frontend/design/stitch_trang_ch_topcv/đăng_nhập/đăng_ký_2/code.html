<!DOCTYPE html>
<html class="light" lang="vi"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Popup Đăng nhập/Đăng ký</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#136dec",
            "background-light": "#f6f7f8",
            "background-dark": "#101822",
          },
          fontFamily: {
            "display": ["Inter", "sans-serif"]
          },
          borderRadius: {
            "DEFAULT": "0.25rem",
            "lg": "0.5rem",
            "xl": "0.75rem",
            "full": "9999px"
          },
        },
      },
    }
  </script>
<style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
  </style>
</head>
<body class="font-display">
<div class="relative flex h-screen w-full flex-col bg-gray-100 dark:bg-gray-900 group/design-root overflow-x-hidden">
<div class="p-8">
<button class="flex min-w-[84px] max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-lg h-12 px-6 bg-primary text-white text-base font-bold leading-normal tracking-[0.015em] hover:bg-primary/90 transition-colors">
<span class="truncate">Đăng nhập / Đăng ký</span>
</button>
</div>
<div class="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-50 p-4">
<div class="relative flex w-full max-w-lg flex-col overflow-hidden rounded-xl bg-background-light dark:bg-background-dark shadow-2xl">
<button class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 dark:hover:text-gray-200 transition-colors">
<span class="material-symbols-outlined">close</span>
</button>
<div class="p-6 sm:p-8">
<div class="w-full">
<header class="flex items-center justify-center gap-4 text-primary mb-6">
<div class="size-6">
<svg fill="none" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
<path clip-rule="evenodd" d="M24 4H42V17.3333V30.6667H24V44H6V30.6667V17.3333H24V4Z" fill="currentColor" fill-rule="evenodd"></path>
</svg>
</div>
<h2 class="text-2xl font-bold tracking-tight">TopCV.vn</h2>
</header>
<div class="flex">
<div class="flex h-12 flex-1 items-center justify-center rounded-lg bg-slate-200 dark:bg-gray-800 p-1">
<label class="flex cursor-pointer h-full grow items-center justify-center overflow-hidden rounded-lg px-2 has-[:checked]:bg-white dark:has-[:checked]:bg-gray-700 has-[:checked]:shadow-[0_0_4px_rgba(0,0,0,0.1)] has-[:checked]:text-gray-900 dark:has-[:checked]:text-white text-gray-500 dark:text-gray-400 text-sm font-medium leading-normal">
<span class="truncate">Đăng nhập</span>
<input checked="" class="invisible w-0" name="auth-toggle" type="radio" value="Đăng nhập"/>
</label>
<label class="flex cursor-pointer h-full grow items-center justify-center overflow-hidden rounded-lg px-2 has-[:checked]:bg-white dark:has-[:checked]:bg-gray-700 has-[:checked]:shadow-[0_0_4px_rgba(0,0,0,0.1)] has-[:checked]:text-gray-900 dark:has-[:checked]:text-white text-gray-500 dark:text-gray-400 text-sm font-medium leading-normal">
<span class="truncate">Đăng ký</span>
<input class="invisible w-0" name="auth-toggle" type="radio" value="Đăng ký"/>
</label>
</div>
</div>
<div class="mt-6 space-y-4">
<h2 class="text-xl font-bold text-center text-gray-900 dark:text-white">Chào mừng trở lại</h2>
<div class="flex flex-col space-y-4">
<label class="flex flex-col min-w-40 flex-1">
<p class="text-gray-800 dark:text-gray-300 text-sm font-medium leading-normal pb-2">Email/Số điện thoại</p>
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-gray-900 dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-gray-300 dark:border-gray-600 bg-background-light dark:bg-gray-800 h-12 placeholder:text-gray-400 dark:placeholder:text-gray-500 p-3 text-base font-normal leading-normal" placeholder="Nhập email hoặc số điện thoại của bạn" value=""/>
</label>
<label class="flex flex-col min-w-40 flex-1">
<p class="text-gray-800 dark:text-gray-300 text-sm font-medium leading-normal pb-2">Mật khẩu</p>
<div class="flex w-full flex-1 items-stretch">
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-l-lg text-gray-900 dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-gray-300 dark:border-gray-600 bg-background-light dark:bg-gray-800 h-12 placeholder:text-gray-400 dark:placeholder:text-gray-500 p-3 border-r-0 text-base font-normal leading-normal" placeholder="Nhập mật khẩu của bạn" type="password" value=""/>
<div class="text-gray-400 flex border border-gray-300 dark:border-gray-600 bg-background-light dark:bg-gray-800 items-center justify-center px-3 rounded-r-lg border-l-0">
<span class="material-symbols-outlined" style="font-size: 20px;">visibility_off</span>
</div>
</div>
</label>
</div>
<div class="flex items-center gap-4 bg-transparent min-h-14 justify-between text-sm">
<div class="flex items-center gap-2">
<input class="h-4 w-4 rounded border-gray-300 dark:border-gray-600 bg-transparent text-primary checked:bg-primary checked:border-primary focus:ring-primary/50 focus:ring-offset-background-light dark:focus:ring-offset-background-dark" id="remember-me" type="checkbox"/>
<label class="text-gray-600 dark:text-gray-400 font-normal leading-normal flex-1 truncate" for="remember-me">Lưu thông tin đăng nhập</label>
</div>
<div class="shrink-0"><button class="font-medium text-primary hover:underline">Quên mật khẩu?</button></div>
</div>
<button class="flex min-w-[84px] max-w-[480px] w-full cursor-pointer items-center justify-center overflow-hidden rounded-lg h-12 px-4 bg-primary text-white text-base font-bold leading-normal tracking-[0.015em] hover:bg-primary/90 transition-colors">
<span class="truncate">Đăng nhập</span>
</button>
<div class="relative flex items-center py-2">
<div class="flex-grow border-t border-gray-300 dark:border-gray-600"></div>
<span class="flex-shrink mx-4 text-sm text-gray-500 dark:text-gray-400">Hoặc tiếp tục với</span>
<div class="flex-grow border-t border-gray-300 dark:border-gray-600"></div>
</div>
<button class="flex w-full items-center justify-center gap-2 h-11 px-4 border border-gray-300 dark:border-gray-600 rounded-lg text-gray-700 dark:text-gray-300 hover:bg-slate-100 dark:hover:bg-gray-700 transition-colors">
<img class="h-5 w-5" data-alt="Google logo" src="https://lh3.googleusercontent.com/aida-public/AB6AXuD8FFBhiGQvx9JUVdrAdBu-Y_QS8XOx3XHpVsQC7Nare1t01oo3dfFtllNWmvpTzVif8iCsRmpA4G50QhFBcNHSLRaQ838pAkkFE6bDDYbmDjWjlN04jvR0jF6On8WQfUIOpGXms_VVCmCLWluiGDgsQRDFF_19RbQoEC3AgspwI0l9vqjntandmmuHAQ0W48EIwdVinAMeigAhBxnm0RiHC6Vm0zpNg7dYUc70CWohYLQIvAf9QNPLgcdhy7WUQ8OARNaFRlOW6RNw"/>
<span>Đăng nhập bằng Google</span>
</button>
<p class="text-center text-xs text-gray-500 dark:text-gray-400 pt-4">Bằng việc tiếp tục, bạn đồng ý với <a class="text-primary hover:underline" href="#">Điều khoản Dịch vụ</a> và <a class="text-primary hover:underline" href="#">Chính sách Bảo mật</a> của chúng tôi.</p>
</div>
</div>
</div>
</div>
</div>
</div>

</body></html>
