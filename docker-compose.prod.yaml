services:
  # --- Infrastructure ---
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ttn-postgres-prod
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: ttn_db
    # Production: Consider removing ports if external access is not needed
    # ports:
    #   - "5432:5432"
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    networks:
      - app-network

  minio:
    image: minio/minio:latest
    container_name: ttn-minio-prod
    restart: always
    env_file:
      - ./.env # Global env if needed
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data_prod:/data
    command: server /data --console-address ":9001"
    networks:
      - app-network

  createbuckets:
    image: minio/mc
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c " /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin; /usr/bin/mc mb --ignore-existing myminio/ttn-bucket; /usr/bin/mc anonymous set public myminio/ttn-bucket; exit 0; "
    networks:
      - app-network

  # --- Application ---
  backend:
    image: aki201/ttn-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: ttn-backend-prod
    restart: always
    # Using root config file
    env_file:
      - ./backend.env
    environment:
      NODE_ENV: production
      PORT: 4000
      # Overrides for Docker Internal Network
      DATABASE_URL: postgresql://user:password@postgres:5432/ttn_db
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
    depends_on:
      - postgres
      - minio
    # NO PORTS EXPOSED (Internal only)
    networks:
      - app-network

  web:
    image: aki201/ttn-web:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        NEXT_PUBLIC_API_URL: /api
    container_name: ttn-web-prod
    restart: always
    # Using root config file
    env_file:
      - ./frontend.env
    environment:
      NODE_ENV: production
      # Nginx will handle routing, so API URL is relative or through Nginx port
      NEXT_PUBLIC_API_URL: /api
      INTERNAL_API_URL: http://backend:4000
    depends_on:
      - backend
    # NO PORTS EXPOSED (Internal only)
    networks:
      - app-network

  # --- Gateway ---
  nginx:
    image: nginx:alpine
    container_name: ttn-nginx-prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    depends_on:
      - web
      - backend
    networks:
      - app-network

  certbot:
    image: certbot/certbot
    container_name: ttn-certbot
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    networks:
      - app-network

volumes:
  postgres_data_prod:
  minio_data_prod:


networks:
  app-network:
    driver: bridge
