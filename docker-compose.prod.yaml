services:
  # --- Infrastructure ---
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ttn-postgres-prod
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: ttn_db
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    networks:
      - app-network

  minio:
    image: minio/minio:latest
    container_name: ttn-minio-prod
    restart: always
    env_file:
      - ./.env # Global env if needed
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data_prod:/data
    command: server /data --console-address ":9001"
    networks:
      - app-network

  createbuckets:
    image: minio/mc
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c " /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin; /usr/bin/mc mb --ignore-existing myminio/ttn-bucket; /usr/bin/mc anonymous set public myminio/ttn-bucket; exit 0; "
    networks:
      - app-network

  # --- Application ---
  backend:
    image: aki201/ttn-backend:latest
    build:
      context: .
      dockerfile: backend/Dockerfile.prod
    container_name: ttn-backend-prod
    restart: always
    # Inject tất cả env từ .env.production
    env_file:
      - .env
    environment:
      NODE_ENV: production
      # CRITICAL: Backend phải listen port 4000
      PORT: "4000"
      # Override nếu cần (ưu tiên environment > env_file)
      DATABASE_URL: postgresql://user:password@postgres:5432/ttn_db
      MINIO_ENDPOINT: minio
    depends_on:
      - postgres
      - minio
    # NO PORTS EXPOSED (Internal only)
    networks:
      - app-network

  web:
    image: aki201/ttn-web:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      # CRITICAL: Truyền NEXT_PUBLIC_* vào build time
      args:
        NEXT_PUBLIC_API_ENDPOINT: /api
        NEXT_PUBLIC_APP_URL: https://timviec.vieclamhr.com
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID}
    container_name: ttn-web-prod
    restart: always
    # Inject runtime env (INTERNAL_API_URL, etc.)
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      # CRITICAL: Frontend phải listen port 3000
      PORT: "3000"
      INTERNAL_API_URL: http://backend:4000
    depends_on:
      - backend
    # NO PORTS EXPOSED (Internal only)
    networks:
      - app-network

  # --- Gateway ---
  nginx:
    image: nginx:alpine
    container_name: ttn-nginx-prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    depends_on:
      - web
      - backend
    networks:
      - app-network

  certbot:
    image: certbot/certbot
    container_name: ttn-certbot
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    networks:
      - app-network

volumes:
  postgres_data_prod:
  minio_data_prod:

networks:
  app-network:
    driver: bridge
